# Bindings portabili — template da usare su un nuovo PC.
#
# Se config/bindings.toml non esiste, install-on-usb.sh copia questo
# file al suo posto. Se esiste gia', resta intatto: il tuo resta la
# configurazione effettiva.
#
# icon puo' essere:
#   - un percorso assoluto   "/home/user/Pictures/zen.svg"
#   - un nome del tema icone  "jellyfin"
#   - il nome di un file      "zen-browser.svg"
#   - stringa vuota ""        -> usa l'Icon= del .desktop (tipo "app")
#                                oppure il fallback nome+colore (tipo
#                                "command"); se il percorso indicato non
#                                esiste sul nuovo PC il frontend fa lo
#                                stesso fallback, quindi e' solo estetico.

[[bindings]]
slot = 1
type = "app"
name = "Zen Browser"
# Verifica il vero nome del .desktop sul nuovo PC con:
#   grep -Ril "^Name=.*Zen" ~/.local/share/applications /usr/share/applications 2>/dev/null
desktop = "app.zen_browser.zen.desktop"
icon = ""
color = "#d95f02"

[[bindings]]
slot = 2
type = "command"
name = "Audiobookshelf"
command = "xdg-open http://<IP-TAILSCALE-NPM>:13378"
icon = ""
color = "#1f77b4"

[[bindings]]
slot = 3
type = "command"
name = "Jellyfin"
command = "xdg-open http://<IP-TAILSCALE-NPM>:8096"
icon = ""
color = "#9467bd"

[[bindings]]
slot = 4
type = "command"
name = "fabsfin"
command = "xdg-open http://<IP-TAILSCALE-NPM>:8096"
icon = ""
color = "#9467bd"
