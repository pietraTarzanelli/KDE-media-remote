[[bindings]]
slot = 1
type = "app"
name = "VacuumTube"
desktop = "rocks.shy.VacuumTube.desktop"
icon = "/var/lib/flatpak/appstream/flathub/x86_64/413b0b7824cfee2af9a458205b1c6f9370a15ca3273592ec9284cd12468e5947/icons/128x128/rocks.shy.VacuumTube.png"
color = "#6f4fb0"

[[bindings]]
slot = 2
type = "command"
name = "Jellyfin"
command = "/usr/bin/flatpak run org.jellyfin.JellyfinDesktop"
icon = "/var/lib/flatpak/exports/share/icons/hicolor/scalable/apps/org.jellyfin.JellyfinDesktop.svg"
color = "#9467bd"

